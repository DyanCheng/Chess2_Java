spring:
  application:
    name: chess2-java
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME:}
    password: ${SUPABASE_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:4}
      minimum-idle: 0
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: chess
        jdbc:
          time_zone: UTC
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    create-schemas: true
    default-schema: chess
    schemas: chess
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  password-reset:
    public-url: ${PUBLIC_APP_URL:http://localhost:8080/}
    mail-from: ${MAIL_FROM:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
