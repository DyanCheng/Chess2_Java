services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: 8080
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:?Set SUPABASE_DB_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:19006}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-4}
    ports:
      - "8080:8080"
